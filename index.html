<!DOCTYPE html>
<html lang="ja">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1, viewport-fit=cover">
<title>カードコレクション</title>
<!-- このページは「カードパック」設定ページの「閲覧サイト用に書き出す」で作られます。中身は data.js に入っています -->
<style>
  :root {
    color-scheme: light dark;
    --bg: #fbf7fa; --panel: #ffffff; --text: #3d2a40; --sub: #8a7590;
    --line: #eadde6; --accent: #e2559c; --accent-soft: #fbe3ef; --paper: #fffdf8;
  }
  @media (prefers-color-scheme: dark) {
    :root { --bg: #1e1a22; --panel: #2a2430; --text: #f1e6f0; --sub: #b3a2b6;
            --line: #3e3445; --accent: #ff8fc7; --accent-soft: #46283a; --paper: #fffdf8; }
  }
  * { box-sizing: border-box; }
  html { scroll-padding-top: env(safe-area-inset-top, 0px); }
  body { margin: 0; background: var(--bg); color: var(--text);
         font: 15px/1.6 "Yu Gothic UI", "Hiragino Sans", "Meiryo", sans-serif;
         padding: env(safe-area-inset-top, 0px) 0 env(safe-area-inset-bottom, 0px); }
  main { max-width: 960px; margin: 0 auto; padding: 28px 16px 60px; }
  header.site { margin-bottom: 22px; }
  header.site h1 { margin: 0; font-size: 28px; font-weight: 900; letter-spacing: .02em; }
  header.site p { margin: 2px 0 0; color: var(--sub); font-size: 13px; }

  /* ---------- 配信者さんのリンク ---------- */
  .links { display: flex; flex-wrap: wrap; gap: 8px; margin-top: 10px; }
  .links a { display: inline-grid; place-items: center; width: 40px; height: 40px; border-radius: 50%;
             color: #fff; text-decoration: none; font-weight: 700; font-size: 12px; background: var(--lc, var(--accent));
             transition: transform .15s; }
  .links a:hover { transform: translateY(-2px); filter: brightness(1.15); }
  .links img { width: 20px; height: 20px; filter: invert(1); display: block; }   /* 黒いアイコンを白に */
  .links a:focus-visible { outline: 3px solid var(--accent); outline-offset: 2px; }

  /* ---------- 称号 ---------- */
  .titles { display: flex; flex-wrap: wrap; gap: 6px; margin: 0 0 18px; padding: 0; list-style: none; }
  .titles li { display: inline-flex; align-items: center; gap: 4px; padding: 3px 12px; border-radius: 999px; font-size: 13px; font-weight: 700;
               background: var(--accent-soft); color: var(--text); border: 1px solid var(--accent); }
  .titles li.locked { background: transparent; color: var(--sub); border: 1px dashed var(--line); font-weight: 400; opacity: .7; }
  .titles li.tm { background: none; border: none; padding: 0; }
  .titles li { position: relative; }
  .tt { all: unset; cursor: help; }
  .tt:focus-visible { outline: 2px solid var(--accent); outline-offset: 3px; border-radius: 4px; }
  /* 条件の吹き出し（マウスを乗せる・押す・キーボードで選ぶと出る） */
  .tt[data-desc]::after { content: attr(data-desc); position: absolute; left: 50%; bottom: calc(100% + 8px); transform: translateX(-50%);
    white-space: nowrap; background: #3d2a40; color: #fff; font-size: 12px; font-weight: 400; padding: 4px 10px; border-radius: 8px;
    opacity: 0; pointer-events: none; transition: opacity .12s; z-index: 5; box-shadow: 0 4px 12px rgba(0,0,0,.25); }
  .tt.edge-l::after { left: 0; transform: none; }
  .tt.edge-r::after { left: auto; right: 0; transform: none; }
  .tt[data-desc]:hover::after, .tt[data-desc]:focus-visible::after, .tt[aria-expanded=true]::after { opacity: 1; }
  .titles-more { font: inherit; font-size: 13px; color: var(--sub); background: transparent; border: none; cursor: pointer; padding: 3px 6px; text-decoration: underline; }
  .tcount { font-size: 12px; color: var(--sub); margin-left: 6px; }
  .more { display: block; margin: 14px auto 0; font: inherit; font-size: 14px; color: var(--text); background: var(--panel); cursor: pointer;
          border: 1px solid var(--line); border-radius: 999px; padding: 8px 28px; }
  .more:hover { border-color: var(--accent); }
  .more:focus-visible { outline: 3px solid var(--accent); outline-offset: 2px; }

  /* ---------- 一覧 ---------- */
  .tools { display: flex; gap: 10px; margin-bottom: 12px; }
  .tools input { font: inherit; color: inherit; background: var(--panel); border: 1px solid var(--line);
                 border-radius: 999px; padding: 8px 16px; width: 100%; max-width: 320px; }
  .users { list-style: none; margin: 0; padding: 0; background: var(--panel);
           border: 1px solid var(--line); border-radius: 14px; overflow: hidden; }
  .users li + li { border-top: 1px solid var(--line); }
  .users a { display: grid; grid-template-columns: 2.2em 40px 1fr auto; gap: 12px; align-items: center;
             padding: 10px 16px; color: inherit; text-decoration: none; }
  .users a:hover { background: var(--accent-soft); }
  .users a:focus-visible { outline: 3px solid var(--accent); outline-offset: -3px; }
  .rank { color: var(--sub); font-weight: 700; text-align: right; font-variant-numeric: tabular-nums; }
  .icon { width: 40px; height: 40px; border-radius: 50%; background: var(--line); object-fit: cover; display: block; }
  .who b { display: block; overflow: hidden; text-overflow: ellipsis; white-space: nowrap; }
  .meter { display: block; height: 6px; border-radius: 999px; background: var(--line); overflow: hidden; margin-top: 4px; max-width: 360px; }
  .meter i { display: block; height: 100%; background: var(--accent); border-radius: inherit; }
  .stat { text-align: right; font-variant-numeric: tabular-nums; font-size: 13px; color: var(--sub); white-space: nowrap; }
  .stat b { color: var(--text); font-size: 18px; }
  .stat .pl { font-size: 12px; margin-right: 4px; }
  .done .stat b { color: var(--accent); }
  .empty { color: var(--sub); padding: 24px 16px; text-align: center; }

  /* ---------- 個人ページ ---------- */
  .back { display: inline-block; color: var(--sub); text-decoration: none; margin-bottom: 14px; }
  .back:hover { color: var(--text); }
  .profile { display: flex; align-items: center; gap: 16px; margin-bottom: 14px; }
  .profile .icon { width: 64px; height: 64px; }
  .profile h2 { margin: 0; font-size: 24px; }
  .profile p { margin: 0; color: var(--sub); }
  .rate { display: flex; align-items: baseline; gap: 6px; margin-left: 18px; padding-left: 18px; border-left: 1px solid var(--line); }
  .rate span { color: var(--sub); font-weight: 700; font-size: 14px; }
  @media (max-width: 520px) { .profile { flex-wrap: wrap; } .rate { margin-left: 0; padding-left: 0; border-left: none; width: 100%; } }
  .big { font-size: 40px; font-weight: 900; line-height: 1; color: var(--accent); font-variant-numeric: tabular-nums; }
  .chips { display: flex; flex-wrap: wrap; gap: 8px; margin: 0 0 18px; padding: 0; list-style: none; }
  .chips button { font: inherit; color: inherit; cursor: pointer; border: 2px solid var(--rc); border-radius: 999px;
                  padding: 2px 12px; font-size: 13px; font-variant-numeric: tabular-nums; background: var(--panel); }
  .chips button b { color: var(--rt); margin-right: 6px; }
  .chips button[aria-pressed=true] { background: var(--rc); color: #fff; }
  .chips button[aria-pressed=true] b { color: #fff; }
  .chips.picking button[aria-pressed=false] { opacity: .5; }
  .chips button:focus-visible { outline: 3px solid var(--accent); outline-offset: 2px; }
  .reset { font: inherit; font-size: 13px; color: var(--sub); background: transparent; cursor: pointer;
           border: 1px dashed var(--line); border-radius: 999px; padding: 2px 12px; }
  .reset:disabled { opacity: .4; cursor: default; }
  .reset:not(:disabled):hover { color: var(--text); border-color: var(--accent); }

  /* ---------- 累計売上 ---------- */
  .pts { display: flex; align-items: baseline; flex-wrap: wrap; gap: 4px 14px; background: var(--panel); border: 1px solid var(--line);
         border-left: 6px solid var(--accent); border-radius: 14px; padding: 12px 18px; margin: 0 0 18px; }
  .pts .pl { color: var(--sub); font-weight: 700; font-size: 14px; }
  .pts .pv { font-size: 34px; font-weight: 900; color: var(--accent); line-height: 1.1; font-variant-numeric: tabular-nums; }
  .pts .pv small { font-size: 15px; margin-left: 6px; color: var(--sub); font-weight: 700; }

  /* ---------- 拡大表示 ---------- */
  .open { all: unset; display: block; width: 100%; box-sizing: border-box; cursor: zoom-in; border-radius: var(--cr, 12px); }
  .open:focus-visible { outline: 3px solid var(--accent); outline-offset: 3px; }
  .open:hover .card { transform: translateY(-3px); box-shadow: 0 8px 18px rgba(60, 20, 50, .25); }
  .open .card { transition: transform .15s, box-shadow .15s; }
  dialog#zoom { border: none; background: transparent; padding: 0; max-width: 100vw; max-height: 100vh; overflow: visible; }
  dialog#zoom::backdrop { background: rgba(20, 8, 20, .78); }
  .zwrap { display: flex; flex-direction: column; align-items: center; gap: 12px; color: #fff; }
  .zrow { display: flex; align-items: center; gap: 12px; }
  .zcard { width: min(76vw, 380px, calc(68vh * var(--rn, .714))); }
  .zcard .card { box-shadow: 0 10px 40px rgba(0, 0, 0, .5); border-radius: var(--zcr, 20px); }
  .zcard .paper { border-radius: max(0px, calc(var(--zcr, 20px) * .7)); }
  .zcard .card.noframe .paper { border-radius: var(--zcr, 20px); }
  .zcard .badge { font-size: 16px; padding: 1px 10px; }
  .zcard .paper .rl { font-size: 48px; }
  .zcard .paper .nm { font-size: 18px; }
  .zinfo { text-align: center; line-height: 1.4; }
  .zinfo b { font-size: 20px; display: block; }
  .zinfo span { font-size: 14px; opacity: .85; }
  .znav, .zclose { font: inherit; color: #fff; background: rgba(255,255,255,.14); border: 1px solid rgba(255,255,255,.35);
                   border-radius: 999px; cursor: pointer; }
  .znav { width: 44px; height: 44px; font-size: 20px; flex: none; }
  .znav:disabled { opacity: .25; cursor: default; }
  .zclose { padding: 6px 22px; font-size: 14px; }
  .znav:focus-visible, .zclose:focus-visible { outline: 3px solid #fff; outline-offset: 2px; }
  @media (max-width: 520px) { .znav { width: 36px; height: 36px; font-size: 16px; } .zrow { gap: 6px; } }
  .filters { display: flex; flex-wrap: wrap; gap: 6px; margin-bottom: 16px; }
  .filters button { font: inherit; font-size: 13px; color: var(--sub); background: transparent; cursor: pointer;
                    border: 1px solid var(--line); border-radius: 999px; padding: 4px 14px; }
  .filters button[aria-pressed=true] { color: var(--text); border-color: var(--accent); background: var(--accent-soft); }
  .filters button:focus-visible { outline: 3px solid var(--accent); outline-offset: 2px; }
  h3 { font-size: 15px; margin: 24px 0 10px; color: var(--sub); font-weight: 700; }

  /* ---------- カード ---------- */
  .grid { display: grid; grid-template-columns: repeat(auto-fill, minmax(124px, 1fr)); gap: 18px 14px; }
  .slot { margin: 0; }
  .card { position: relative; aspect-ratio: var(--ratio, 5 / 7); border-radius: var(--cr, 12px);
          padding: 3.5%; background: var(--rc); box-shadow: 0 4px 12px rgba(60, 20, 50, .18); }
  .card.noframe { padding: 0; background: none; }
  .card.rainbow { background: conic-gradient(from 210deg, #ff5f9e, #ffd84d, #5fffb0, #5fc8ff, #b45fff, #ff5f9e); }
  .card.noframe.rainbow { background: none; }
  .paper { position: relative; width: 100%; height: 100%; overflow: hidden; background: var(--paper); color: #3d2a40;
           border-radius: max(0px, calc(var(--cr, 12px) * .7)); display: flex; flex-direction: column;
           align-items: center; justify-content: center; gap: 4px; text-align: center; }
  .card.noframe .paper { border-radius: var(--cr, 12px); }
  .paper img { position: absolute; left: 0; top: 0; width: 100%; height: 100%; object-fit: cover; display: block; max-width: none; }
  .paper .rl { font-size: 26px; font-weight: 900; color: var(--rt); line-height: 1; }
  .paper .nm { font-size: 12px; font-weight: 700; padding: 0 6px; }
  .badge { position: absolute; left: 6%; top: 5%; padding: 0 7px; border-radius: 999px; background: var(--rc);
           color: #fff; font-size: 12px; font-weight: 900; text-shadow: 0 1px 2px rgba(0,0,0,.35); }
  .count { position: absolute; right: 5%; bottom: 4%; min-width: 1.8em; padding: 0 6px; border-radius: 999px;
           background: rgba(30, 15, 30, .78); color: #fff; font-size: 12px; font-weight: 700; text-align: center; }
  .card.missing { background: var(--line); box-shadow: none; }
  .card.missing .paper { background: repeating-linear-gradient(45deg, var(--panel) 0 8px, var(--bg) 8px 16px); }
  .card.missing .q { font-size: 30px; font-weight: 900; color: var(--sub); opacity: .6; }
  .card.missing .badge { background: var(--sub); opacity: .7; }
  figcaption { font-size: 12px; margin-top: 6px; line-height: 1.4; overflow: hidden; text-overflow: ellipsis; white-space: nowrap; }
  .missing + figcaption { color: var(--sub); }
  footer { margin-top: 40px; color: var(--sub); font-size: 12px; text-align: center; }
  @media (max-width: 520px) {
    .users a { grid-template-columns: 1.6em 36px 1fr auto; gap: 10px; padding: 10px 12px; }
    .icon { width: 36px; height: 36px; }
    .grid { grid-template-columns: repeat(auto-fill, minmax(96px, 1fr)); }
  }
</style>
</head>
<body>
<main id="app"></main>
<footer id="foot"></footer>

<!-- 手動で書き出したときは data.js、公開サイトでは data.json を読みます -->
<script src="data.js" onerror="void 0"></script>
<script>
// ================= ここを変えると見た目が変わります =================
// 一番上に出すリンク（増やす・消すのも自由）
//   icon は Simple Icons の名前（twitch / x / youtube など）
const LINKS = [
  { label: "Twitch", icon: "twitch", url: "https://www.twitch.tv/100nekox", color: "#9146ff" },
  { label: "X（Twitter）", icon: "x", url: "https://x.com/_100neko_", color: "#000000" },
  { label: "YouTube", icon: "youtube", url: "https://www.youtube.com/@100nekox", color: "#ff0000" },
];
const ICON_BASE = "https://cdn.jsdelivr.net/npm/simple-icons@16.34.0/icons/";
// 一覧に最初に出す人数（「もっと見る」で、この人数ずつ増えます）
const SHOW_LIMIT = 50;
// 称号（仮）。check が true になると付きます
//   u.packs：開けたパック数　u.kinds：集めた種類　all：全種類　has(レア度ID)：そのレア度を1枚でも持っている
//   comp(レア度ID)：そのレア度をコンプ　maxDup：同じカードを一番多く持っている枚数
//   need：そのレア度がないときは称号ごと出さない　desc：マウスを乗せる・押したときに出る条件
const TITLES = [
  { name: "はじめての開封", desc: "パックを1回開ける", check: (u) => u.packs >= 1 },
  { name: "10パック開封", desc: "パックを10回開ける", check: (u) => u.packs >= 10 },
  { name: "50パック開封", desc: "パックを50回開ける", check: (u) => u.packs >= 50 },
  { name: "100パック開封", desc: "パックを100回開ける", check: (u) => u.packs >= 100 },
  { name: "はじめてのSR", desc: "SRを1枚手に入れる", need: "SR", check: (u, x) => x.has("SR") },
  { name: "はじめてのSSR", desc: "SSRを1枚手に入れる", need: "SSR", check: (u, x) => x.has("SSR") },
  { name: "はじめてのUR", desc: "URを1枚手に入れる", need: "UR", check: (u, x) => x.has("UR") },
  { name: "SRコンプ", desc: "SRを全種類そろえる", need: "SR", check: (u, x) => x.comp("SR") },
  { name: "SSRコンプ", desc: "SSRを全種類そろえる", need: "SSR", check: (u, x) => x.comp("SSR") },
  { name: "URコンプ", desc: "URを全種類そろえる", need: "UR", check: (u, x) => x.comp("UR") },
  { name: "半分あつめた", desc: "全カードの半分の種類を集める", check: (u, x) => u.kinds * 2 >= x.all },
  { name: "コンプリート", desc: "全種類のカードをそろえる", check: (u, x) => u.kinds >= x.all },
  { name: "ダブりすぎ（同じカード10枚）", desc: "同じカードを10枚持つ", check: (u, x) => x.maxDup >= 10 },
];
// ===================================================================

let D = window.CARDPACK_DATA;
const app = document.getElementById("app");
function esc(s) { return String(s).replace(/[&<>"']/g, (c) => ({ "&": "&amp;", "<": "&lt;", ">": "&gt;", '"': "&quot;", "'": "&#39;" }[c])); }

// 画像の位置・拡大を合わせる（設定ページ・テンプレートと同じ計算）
function fitArt(img, crop) {
  const box = img.parentElement;
  const iw = img.naturalWidth, ih = img.naturalHeight, bw = box.clientWidth, bh = box.clientHeight;
  if (!iw || !ih || !bw || !bh) return;
  const c = { x: 0.5, y: 0.5, zoom: 1, ...(crop || {}) };
  const z = Math.min(5, Math.max(1, Number(c.zoom) || 1));
  const a = iw / ih, A = bw / bh;
  let w = 1, h = 1;
  if (a > A) w = a / A; else h = A / a;
  w *= z; h *= z;
  const left = Math.min(0, Math.max(1 - w, 0.5 - c.x * w));
  const top = Math.min(0, Math.max(1 - h, 0.5 - c.y * h));
  Object.assign(img.style, { width: w * 100 + "%", height: h * 100 + "%", left: left * 100 + "%", top: top * 100 + "%", objectFit: "fill" });
}

(async () => {
  // このPC（わんコメ）で開いたときは、公開を待たずに今の記録を直接読む
  if (!D && /^(localhost|127\.0\.0\.1)$/.test(location.hostname)) {
    try {
      const r = await fetch("/api/plugins/local.cardpack.collection?type=sitedata&t=" + Date.now(), { cache: "no-store" });
      if (r.ok) { const j = await r.json(); D = j.response || j; D.local = true; }
    } catch (e) { /* わんコメが動いていないとき */ }
  }
  if (!D) {
    try {
      const r = await fetch("data.json?t=" + Date.now(), { cache: "no-store" });
      if (r.ok) D = await r.json();
    } catch (e) { /* ファイルを直接開いたときなど */ }
  }
  if (!D) {
    app.innerHTML = `<p class="empty">記録データが見つかりません。少し待ってから開き直してください。</p>`;
    return;
  }
  start();
})();

function start() {
  const S = D.settings;
  const [ra, rb] = String(S.cardRatio || "5:7").split(":").map(Number);
  document.body.style.setProperty("--ratio", `${ra || 5} / ${rb || 7}`);
  // 設定の角の丸さ（230px幅のカード基準）を一覧の大きさに合わせる
  document.body.style.setProperty("--cr", Math.round((Number(S.cardRadius) || 0) * 0.55) + "px");
  document.body.style.setProperty("--zcr", Math.round((Number(S.cardRadius) || 0) * 1.6) + "px");   // 拡大表示用
  document.body.style.setProperty("--rn", String((ra || 5) / (rb || 7)));
  document.title = D.title || "カードコレクション";

  const rarities = S.rarities;
  const rank = (id) => rarities.findIndex((r) => r.id === id);
  const rarityOf = (id) => rarities[rank(id)] || { id, label: id, color: "#ccc", text: "#888" };
  const active = D.cards.filter((c) => c.active);
  const total = active.length || 1;
  // 高いレア度から並べる
  const byRarity = (a, b) => rank(b.rarity) - rank(a.rarity) || a.id.localeCompare(b.id);

  const users = D.users.map((u, i) => {
    const kinds = active.filter((c) => u.cards[c.id]).length;
    return { ...u, key: i, kinds };
  }).sort((a, b) => b.kinds - a.kinds || b.packs - a.packs);

  const when = new Date(D.exportedAt);
  document.getElementById("foot").textContent =
    D.local ? "このPCで見ています（今の記録・まだ公開されていない変更も表示）"
          : `${when.toLocaleString("ja-JP", { dateStyle: "medium", timeStyle: "short" })} 時点の記録`;

  function head(sub) {
    const links = LINKS.filter((l) => /^https:\/\//.test(l.url)).map((l) =>
      `<a href="${esc(l.url)}" target="_blank" rel="noopener" style="--lc:${esc(l.color || "")}" aria-label="${esc(l.label)}" title="${esc(l.label)}">${
        l.icon ? `<img src="${ICON_BASE}${encodeURIComponent(l.icon)}.svg" alt="" onerror="this.replaceWith(document.createTextNode('${esc(l.label.split(/[（(]/)[0].slice(0, 2))}'))">` : esc(l.label.slice(0, 2))}</a>`).join("");
    return `<header class="site"><h1>${esc(D.title || "カードコレクション")}</h1>${sub ? `<p>${sub}</p>` : ""}
      ${links ? `<nav class="links" aria-label="配信者さんのページ">${links}</nav>` : ""}</header>`;
  }

  function cardHtml(c, count, opts = {}) {
    const r = rarityOf(c.rarity);
    const cls = ["card"];
    if (S.showFrame === false) cls.push("noframe");
    if (r.rainbow) cls.push("rainbow");
    const style = `--rc:${esc(r.color)};--rt:${esc(r.text)}`;
    if (!count) {
      return `<figure class="slot"><div class="${cls.join(" ")} missing" style="${style}">
        <div class="paper"><span class="q">？</span></div><span class="badge">${esc(r.label)}</span></div>
        <figcaption>？？？</figcaption></figure>`;
    }
    const inner = c.image
      ? `<img src="${esc(c.image)}" alt="${esc(c.name)}" loading="lazy" data-id="${esc(c.id)}">`
      : `<span class="rl">${esc(r.label)}</span><span class="nm">${esc(c.name)}</span>`;
    const card = `<div class="${cls.join(" ")}" style="${style}">
      <div class="paper">${inner}</div>
      ${c.image ? `<span class="badge">${esc(r.label)}</span>` : ""}
      ${count > 1 && !opts.bare ? `<span class="count">×${count > 99 ? "99+" : count}</span>` : ""}</div>`;
    if (opts.bare) return card;
    return `<figure class="slot"><button class="open" data-open="${esc(c.id)}" aria-label="${esc(c.name)}を大きく見る">${card}</button>
      <figcaption>${esc(c.name)}</figcaption></figure>`;
  }

  function iconHtml(u, lazy) {
    return u.icon ? `<img class="icon" src="${esc(u.icon)}" alt="" referrerpolicy="no-referrer"${lazy ? ` loading="lazy"` : ""}>` : `<span class="icon"></span>`;
  }

  // ---------- 称号 ----------
  function titlesOf(u) {
    const x = {
      all: active.length,
      has: (id) => D.cards.some((c) => c.rarity === id && u.cards[c.id]),
      comp: (id) => { const l = active.filter((c) => c.rarity === id); return l.length > 0 && l.every((c) => u.cards[c.id]); },
      maxDup: Math.max(0, ...Object.values(u.cards).map(Number)),
    };
    // 存在しないレア度の称号は出さない
    const exists = (t) => !t.need || active.some((c) => c.rarity === t.need);
    return TITLES.filter(exists).map((t) => {
      let got = false;
      try { got = !!t.check(u, x); } catch (e) { /* 書き間違いがあっても止めない */ }
      return { name: t.name, desc: t.desc || "", got };
    });
  }
  function titlesHtml(u, showAll) {
    const list = titlesOf(u);
    const got = list.filter((t) => t.got);
    const shown = showAll ? list : got;
    return `<h3>称号<span class="tcount">${got.length}/${list.length}</span></h3>
      <ul class="titles">${shown.map((t) => `<li class="${t.got ? "" : "locked"}"><button class="tt" aria-expanded="false" ${t.desc ? `data-desc="${esc(t.desc)}"` : ""}>${t.got ? "★" : "？"} ${esc(t.name)}</button></li>`).join("")
        || `<li class="locked">まだ称号はありません</li>`}
      <li class="tm"><button class="titles-more" id="tMore">${showAll ? "持っている称号だけ" : "まだの称号も見る"}</button></li></ul>`;
  }

  // 累計売上（設定でオンのときだけ）
  function pointsHtml() {
    const p = D.points;
    if (!p) return "";
    const name = p.name || "ポイント";
    return `<div class="pts"><span class="pl">${esc(name)}累計売上</span>
      <span class="pv">${Number(p.total || 0).toLocaleString("ja-JP")}<small>${esc(name)}</small></span></div>`;
  }

  // ---------- 拡大表示 ----------
  const zoom = document.createElement("dialog");
  zoom.id = "zoom";
  zoom.setAttribute("aria-label", "カードを大きく見る");
  document.body.appendChild(zoom);
  zoom.addEventListener("click", (e) => { if (e.target === zoom) zoom.close(); });   // まわりを押すと閉じる
  let zList = [], zIndex = 0, zUser = null;
  function showZoom() {
    const c = zList[zIndex];
    if (!c) return;
    const r = rarityOf(c.rarity);
    const n = zUser.cards[c.id] || 0;
    zoom.innerHTML = `<div class="zwrap">
      <div class="zrow">
        <button class="znav" data-z="-1" aria-label="前のカード" ${zIndex === 0 ? "disabled" : ""}>←</button>
        <div class="zcard">${cardHtml(c, n, { bare: true })}</div>
        <button class="znav" data-z="1" aria-label="次のカード" ${zIndex >= zList.length - 1 ? "disabled" : ""}>→</button>
      </div>
      <div class="zinfo"><b>${esc(c.name)}</b><span>${esc(r.label)}・${n}枚持っている</span></div>
      <button class="zclose">閉じる</button>
    </div>`;
    zoom.querySelectorAll(".znav").forEach((b) => b.addEventListener("click", () => moveZoom(Number(b.dataset.z))));
    zoom.querySelector(".zclose").addEventListener("click", () => zoom.close());
    const img = zoom.querySelector("img");
    if (img) { const go = () => fitArt(img, c.crop); if (img.complete && img.naturalWidth) requestAnimationFrame(go); else img.addEventListener("load", go); }
  }
  function moveZoom(d) {
    const i = zIndex + d;
    if (i < 0 || i >= zList.length) return;
    zIndex = i; showZoom();
    const b = zoom.querySelector(`.znav[data-z="${d}"]`);
    (b && !b.disabled ? b : zoom.querySelector(".zclose")).focus();
  }
  zoom.addEventListener("keydown", (e) => {
    if (e.key === "ArrowLeft") { e.preventDefault(); moveZoom(-1); }
    if (e.key === "ArrowRight") { e.preventDefault(); moveZoom(1); }
  });
  function openZoom(u, list, id) {
    zUser = u; zList = list; zIndex = Math.max(0, list.findIndex((c) => c.id === id));
    showZoom();
    zoom.showModal();
  }

  // ---------- 一覧 ----------
  let listMax = SHOW_LIMIT;
  function renderList(q = "") {
    const hits = users.filter((u) => !q || u.name.toLowerCase().includes(q.toLowerCase()));
    const list = hits.slice(0, listMax);
    const cut = hits.length - list.length;
    app.innerHTML = head(`${users.length}人が参加・全${active.length}種類`) + pointsHtml() + `
      <div class="tools"><input type="search" id="q" list="names" placeholder="名前でさがす（入力・選択）" aria-label="名前でさがす" value="${esc(q)}" autocomplete="off"></div>
      <datalist id="names">${users.map((u) => `<option value="${esc(u.name)}">`).join("")}</datalist>
      ${list.length ? `<ul class="users">${list.map((u) => {
        const pct = Math.min(100, Math.round(u.kinds / total * 100));
        return `<li class="${u.kinds >= active.length && active.length ? "done" : ""}"><a href="#u${u.key}">
          <span class="rank">${users.indexOf(u) + 1}</span>
          ${iconHtml(u, true)}
          <span class="who"><b>${esc(u.name)}</b><span class="meter"><i style="width:${pct}%"></i></span></span>
          <span class="stat"><span class="pl">所持率</span><b>${pct}%</b><br>${u.kinds}/${active.length}種・${u.packs}パック</span>
        </a></li>`;
      }).join("")}</ul>${cut > 0 ? `<button class="more" id="more">もっと見る（あと${cut}人）</button>` : ""}` : `<p class="empty">${users.length ? "見つかりませんでした" : "まだ誰もパックを引いていません"}</p>`}`;
    const more = document.getElementById("more");
    if (more) more.addEventListener("click", () => {
      const y = window.scrollY, from = list.length;
      listMax += SHOW_LIMIT;
      renderList(document.getElementById("q").value);
      window.scrollTo(0, y);
      // 増えた最初の人にフォーカスを移す（キーボードで続きから見られるように）
      const a = app.querySelectorAll(".users a")[from];
      if (a) a.focus({ preventScroll: true });
    });
    const input = document.getElementById("q");
    input.addEventListener("input", (e) => {
      const exact = users.filter((u) => u.name === input.value);
      // 候補から選んだとき（または名前を最後まで打ったとき）はその人のページへ
      if (exact.length === 1 && (e.inputType === "insertReplacementText" || !e.inputType)) { location.hash = "#u" + exact[0].key; return; }
      const pos = input.selectionStart;
      renderList(input.value);
      const again = document.getElementById("q");
      again.focus(); again.setSelectionRange(pos, pos);
    });
  }

  // ---------- 個人ページ ----------
  let titlesAll = false;
  function renderUser(u, filter = "all", rar = null) {
    const pct = Math.min(100, Math.round(u.kinds / total * 100));
    const sorted = active.slice().sort(byRarity);
    const inRar = (c) => !rar || c.rarity === rar;
    const shown = sorted.filter((c) => inRar(c) && (filter === "all" || (filter === "have" ? u.cards[c.id] : !u.cards[c.id])));
    // 抽選から外れたけど持っているカード
    const retired = D.cards.filter((c) => !c.active && u.cards[c.id] && inRar(c)).sort(byRarity);
    const chips = rarities.slice().reverse().map((r) => {
      const all = active.filter((c) => c.rarity === r.id);
      if (!all.length) return "";
      const have = all.filter((c) => u.cards[c.id]).length;
      return `<li><button data-r="${esc(r.id)}" aria-pressed="${rar === r.id}" style="--rc:${esc(r.color)};--rt:${esc(r.text)}"
        aria-label="${esc(r.label)}だけ表示（${have}/${all.length}）"><b>${esc(r.label)}</b>${have}/${all.length}</button></li>`;
    }).join("");
    const filtered = filter !== "all" || !!rar;
    const rarLabel = rar ? rarityOf(rar).label : "";
    const btn = (v, label) => `<button data-f="${v}" aria-pressed="${filter === v}">${label}</button>`;

    app.innerHTML = head("") + `
      <a class="back" href="#">← 一覧にもどる</a>
      <div class="profile">
        ${iconHtml(u)}
        <div><h2>${esc(u.name)}</h2><p>${u.packs}パック開封・${u.kinds}/${active.length}種類</p></div>
        <div class="rate"><span>所持率</span><b class="big">${pct}%</b></div>
      </div>
      ${titlesHtml(u, titlesAll)}
      <h3>カード</h3>
      <ul class="chips${rar ? " picking" : ""}">${chips}<li><button class="reset" id="resetF" ${filtered ? "" : "disabled"}>リセット</button></li></ul>
      <div class="filters" role="group" aria-label="表示するカード">${btn("all", "すべて")}${btn("have", "持っている")}${btn("miss", "まだ")}</div>
      ${shown.length ? `<div class="grid">${shown.map((c) => cardHtml(c, u.cards[c.id] || 0)).join("")}</div>`
                     : `<p class="empty">${filter === "miss" ? (rar ? `${esc(rarLabel)}はコンプリート！` : "コンプリート！") : (rar ? `${esc(rarLabel)}のカードはまだありません` : "まだカードがありません")}</p>`}
      ${retired.length && filter !== "miss" ? `<h3>今は出ないカード</h3><div class="grid">${retired.map((c) => cardHtml(c, u.cards[c.id])).join("")}</div>` : ""}`;
    // 画面の端では吹き出しが切れないように寄せる
    const edge = (b) => {
      const r = b.getBoundingClientRect(), mid = (r.left + r.right) / 2, room = 120;
      b.classList.toggle("edge-l", mid < room);
      b.classList.toggle("edge-r", mid > document.documentElement.clientWidth - room);
    };
    app.querySelectorAll(".tt").forEach((b) => { b.addEventListener("mouseenter", () => edge(b)); b.addEventListener("focus", () => edge(b)); });
    // 押すと条件を出す（スマホ用）。もう一度押すか、ほかを押すと消える
    app.querySelectorAll(".tt").forEach((b) => b.addEventListener("click", () => {
      edge(b);
      const open = b.getAttribute("aria-expanded") === "true";
      app.querySelectorAll(".tt").forEach((x) => x.setAttribute("aria-expanded", "false"));
      b.setAttribute("aria-expanded", String(!open));
    }));
    document.getElementById("tMore").addEventListener("click", () => {
      titlesAll = !titlesAll;
      const y = window.scrollY;
      renderUser(u, filter, rar);
      window.scrollTo(0, y);
      document.getElementById("tMore").focus();
    });
    app.querySelectorAll(".filters button").forEach((b) =>
      b.addEventListener("click", () => renderUser(u, b.dataset.f, rar)));
    // レア度で絞り込む（もう一度押すと解除）
    app.querySelectorAll(".chips button[data-r]").forEach((b) =>
      b.addEventListener("click", () => {
        renderUser(u, filter, rar === b.dataset.r ? null : b.dataset.r);
        const again = app.querySelector(`.chips button[data-r="${CSS.escape(b.dataset.r)}"]`);
        if (again) again.focus();
      }));
    document.getElementById("resetF").addEventListener("click", () => {
      renderUser(u, "all", null);
      const first = app.querySelector(".chips button[data-r]");
      if (first) first.focus();
    });
    // 持っているカードを押すと大きく見られる（今表示している順で、前後に移動できる）
    const openable = [...shown, ...(filter !== "miss" ? retired : [])].filter((c) => u.cards[c.id]);
    app.querySelectorAll("button[data-open]").forEach((b) =>
      b.addEventListener("click", () => openZoom(u, openable, b.dataset.open)));
    app.querySelectorAll("img[data-id]").forEach((img) => {
      const card = D.cards.find((c) => c.id === img.dataset.id);
      const go = () => fitArt(img, card && card.crop);
      if (img.complete && img.naturalWidth) go(); else img.addEventListener("load", go);
    });
  }

  function route() {
    const m = /^#u(\d+)$/.exec(location.hash);
    const u = m && users.find((x) => x.key === Number(m[1]));
    if (zoom.open) zoom.close();
    if (u) { renderUser(u); window.scrollTo(0, 0); }
    else renderList();
  }
  window.addEventListener("hashchange", route);
  route();
}
</script>
</body>
</html>
